name: rag-comparison
services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${RAGBENCH_NEO4J_PASSWORD:-ragbench-local-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:17474:7474'
      - '127.0.0.1:17687:7687'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  neo4j-data:
