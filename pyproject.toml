[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-rag-lab"
version = "0.1.0"
description = "Compare Graphiti and LightRAG on changing facts, temporal retrieval, and agent memory"
readme = "README.md"
license = "MIT"
authors = [{name = "Gary Morris"}]
keywords = ["rag", "graphiti", "lightrag", "temporal", "retrieval", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "graphiti-core==0.31.2",
  "lightrag-hku==1.5.7",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "tiktoken>=0.7,<1",
  "pydantic-settings>=2.8,<3",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/garyamorris/temporal-rag-lab"
Issues = "https://github.com/garyamorris/temporal-rag-lab/issues"

[project.scripts]
raglab = "rag_comparison.cli:app"
ragbench = "rag_comparison.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_comparison"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rag_comparison/cli.py" = ["B008"]
